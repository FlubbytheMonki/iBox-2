name: Build iBox Legacy IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile App Binary
        run: |
          xcodebuild -project iBox.xcodeproj \
                     -scheme iBox \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/iBox.app Payload/
          zip -r iBox_unsigned.ipa Payload/

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: ibox-ios9-ipa
          path: iBox_unsigned.ipa
