name: Build iBox Legacy IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile App Binary
        run: |
          xcodebuild -project iBox/iBox.xcodeproj \
                     -scheme iBox \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     TARGETED_DEVICE_FAMILY="2" \
                     IPHONEOS_DEPLOYMENT_TARGET=9.0 \
                     CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build \
                     clean build

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          mv build/iBox.app Payload/
          zip -r iBox_unsigned.ipa Payload/

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: ibox-ios9-ipa
          path: iBox_unsigned.ipa
